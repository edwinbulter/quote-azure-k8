version: '3.8'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10001:10001"  # Blob service
      - "10002:10002"  # Queue service  
      - "10000:10000"  # Table service
    volumes:
      - azurite-data:/data
    
  quote-azure-k8-backend:
    image: quote-azure-k8-backend
    container_name: quote-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TableStorageConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10000/devstoreaccount1;
      - JwtSettings:SecretKey=your-secret-key-here-change-in-production
      - JwtSettings:Issuer=QuoteAzureBackend
      - JwtSettings:Audience=QuoteAzureUsers
      - JwtSettings:ExpiryMinutes=60
    depends_on:
      - azurite

volumes:
  azurite-data:

